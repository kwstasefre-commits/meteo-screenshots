name: Λήψη Στιγμιότυπου Χάρτη Κεραυνών

on:
  schedule:
    - cron: '56 20 * * *'
  workflow_dispatch:

jobs:
  take-screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Λήψη του κώδικα του repository
        uses: actions/checkout@v4

      - name: Εγκατάσταση Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Εγκατάσταση βιβλιοθηκών
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Εκτέλεση script λήψης στιγμιότυπου
        run: python take_screenshot.py

      # --- ΝΕΟ ΒΗΜΑ: Αποστολή email με το στιγμιότυπο ---
      - name: Αποστολή email με το στιγμιότυπο
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Στιγμιότυπο Χάρτη Κεραυνών - $(date +'%Y-%m-%d %H:%M')"
          to: ${{ secrets.MAIL_TO }}
          from: "Meteo Bot <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Αυτόματο στιγμιότυπο του χάρτη κεραυνών του meteo.gr.
            Ημερομηνία: $(date +'%Y-%m-%d %H:%M') (ώρα Ελλάδας)
          attachments: screenshot_*.png
      # --------------------------------------------------

      - name: Αποθήκευση στιγμιότυπων ως artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meteo-screenshots
          path: |
            screenshot_*.png
            debug_full_page.png
          retention-days: 90

      - name: Commit και push του στιγμιότυπου στο repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ls screenshot_*.png 1> /dev/null 2>&1; then
            git add screenshot_*.png
            git commit -m "Αυτόματο στιγμιότυπο χάρτη κεραυνών $(date +'%Y-%m-%d %H:%M')" || echo "Δεν υπάρχουν αλλαγές"
            git push
          else
            echo "Σφάλμα: Δεν βρέθηκε αρχείο screenshot!"
            exit 1
          fi
